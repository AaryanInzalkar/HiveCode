name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: cd services/hivecode && uv pip install -e ".[dev]"
      - name: Run Ruff
        run: cd services/hivecode && ruff check .
      - name: Run mypy
        run: cd services/hivecode && mypy src/
      - name: Run import-linter
        run: cd services/hivecode && lint-imports

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hivecode
          POSTGRES_PASSWORD: hivecode
          POSTGRES_DB: hivecode
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hivecode"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: cd services/hivecode && uv pip install -e ".[dev]"
      - name: Run migrations
        run: cd services/hivecode && alembic upgrade head
        env:
          HIVECODE_DATABASE_URL: postgresql+psycopg://hivecode:hivecode@localhost:5432/hivecode
      - name: Run tests
        run: cd services/hivecode && pytest tests/ -v --cov=src --cov-report=xml
        env:
          HIVECODE_DATABASE_URL: postgresql+psycopg://hivecode:hivecode@localhost:5432/hivecode
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: services/hivecode/coverage.xml

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: cd apps/web && npm install
      - name: Run ESLint
        run: cd apps/web && npm run lint
      - name: Run TypeScript check
        run: cd apps/web && npx tsc --noEmit

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
