name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/hivecode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap pip
        run: |
          curl -sS https://bootstrap.pypa.io/get-pip.py | python
          pip install --upgrade pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run Ruff
        run: ruff check .
      - name: Run mypy
        run: mypy src/

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hivecode
          POSTGRES_PASSWORD: hivecode
          POSTGRES_DB: hivecode
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hivecode"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/hivecode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap pip
        run: |
          curl -sS https://bootstrap.pypa.io/get-pip.py | python
          pip install --upgrade pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          HIVECODE_DATABASE_URL: postgresql+psycopg://hivecode:hivecode@localhost:5432/hivecode

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Run ESLint
        run: npx next lint || true
      - name: Run TypeScript check
        run: npx tsc --noEmit || true

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
